<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Content Tracker & Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f172a',
                        accent: '#6366f1',
                        success: '#22c55e',
                        bgMain: '#f8fafc'
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8fafc;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Deck-style checkbox toggle */
        .deck-toggle input:checked + .toggle-bg { background-color: #22c55e; }
        .deck-toggle input:checked + .toggle-bg .toggle-dot { transform: translateX(1.25rem); }
        
        .card-anim { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #toast {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(-120%);
        }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body class="text-slate-900 antialiased h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 z-50 shrink-0 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
                <i data-lucide="layers" class="w-5 h-5 text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm leading-none">hisanatani.com</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase mt-1 tracking-wider" id="current-sheet-label">Tracker</p>
            </div>
        </div>
        <button onclick="loadData()" class="p-2 bg-slate-100 rounded-full hover:bg-slate-200 transition-colors relative" id="syncBtn">
            <i data-lucide="refresh-cw" class="w-4 h-4 text-slate-600" id="syncIcon"></i>
        </button>
    </header>

    <!-- Global Feedback Toast -->
    <div class="fixed top-4 left-0 right-0 z-[100] flex justify-center pointer-events-none">
        <div id="toast" class="bg-slate-900 text-white px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-3 text-sm font-medium">
            <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-indigo-400" id="toast-icon"></i>
            <span id="toast-msg">Syncing data...</span>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto no-scrollbar pb-32" id="main-scroll">
        <div id="errorDisplay" class="hidden m-4 p-4 bg-red-50 border border-red-100 rounded-xl text-red-600 text-sm flex gap-3">
            <i data-lucide="alert-circle" class="w-5 h-5 shrink-0"></i>
            <span id="errorMsg"></span>
        </div>
        
        <div id="appContent" class="p-4 max-w-2xl mx-auto space-y-6">
            <!-- Content will be injected here -->
        </div>
    </main>

    <!-- Bottom Menu Navigation -->
    <nav class="bg-white/80 backdrop-blur-md border-t border-slate-200 fixed bottom-0 w-full z-50 pb-[env(safe-area-inset-bottom)]">
        <div class="flex justify-around items-center h-16 max-w-lg mx-auto">
            <button onclick="switchTab('tracker')" id="tab-tracker" class="flex flex-col items-center gap-1 text-accent">
                <i data-lucide="layout-list" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold uppercase">Tracker</span>
            </button>
            <button onclick="switchTab('planner')" id="tab-planner" class="flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="calendar-check" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold uppercase">Planner</span>
            </button>
            <button onclick="switchTab('settings')" id="tab-settings" class="flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="settings-2" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold uppercase">Settings</span>
            </button>
        </div>
    </nav>

<script>
const SHEET_ID = '13pUQeLmSwca3Jl4GCvOQ82Whiu79fgAfBAKi4PbhNKM';
const DEFAULT_API_KEY = 'AIzaSyByRHRdnpDDHLxBnCBV27mSRu0tu_dlAhg';

let API_KEY = DEFAULT_API_KEY;
try { API_KEY = localStorage.getItem('gapi_key') || DEFAULT_API_KEY; } catch(e){}

let appState = {
    sheets: {},
    names: [],
    activeTab: 'tracker',
    filters: {
        chapter: 'All',
        search: ''
    }
};

// Initial Load
document.addEventListener("DOMContentLoaded", () => {
    lucide.createIcons();
    if (API_KEY) loadData();
    else switchTab('settings');
});

async function loadData() {
    toggleSyncAnim(true);
    showToast("Syncing latest data...", true);
    
    try {
        const metaRes = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?key=${API_KEY}`);
        const meta = await metaRes.json();
        if (meta.error) throw new Error(meta.error.message);
        
        appState.names = meta.sheets.map(s => s.properties.title);
        appState.sheets = {};

        for (const name of appState.names) {
            const dataRes = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(name)}?key=${API_KEY}`);
            const data = await dataRes.json();
            if (data.values) {
                appState.sheets[name] = {
                    headers: data.values[0] || [],
                    rows: data.values.slice(1).filter(r => r.length > 0 && r[0])
                };
            }
        }
        
        hideError();
        render();
        showToast("Connected!", false);
    } catch (e) {
        showError(e.message);
        showToast("Connection failed", false, true);
    } finally {
        toggleSyncAnim(false);
    }
}

function render() {
    const container = document.getElementById('appContent');
    const label = document.getElementById('current-sheet-label');
    
    if (appState.activeTab === 'tracker') {
        label.textContent = "Content Tracker";
        renderTracker(container);
    } else if (appState.activeTab === 'planner') {
        label.textContent = "Daily Planner";
        renderPlanner(container);
    } else {
        label.textContent = "App Settings";
        renderSettings(container);
    }
    
    lucide.createIcons();
}

function renderTracker(container) {
    const sheetName = appState.names[0];
    const data = appState.sheets[sheetName];
    if (!data) return;

    const { headers, rows } = data;
    const checkboxCols = getCheckboxColumns(headers, rows);
    const chapters = getChapters(rows);

    let html = `
        <div class="sticky top-0 bg-bgMain/90 backdrop-blur-sm z-20 pb-4 space-y-3">
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" placeholder="Search content..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm" value="${appState.filters.search}" oninput="appState.filters.search=this.value;render()">
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                ${chapters.map(ch => `
                    <button onclick="appState.filters.chapter='${ch}';render()" class="shrink-0 px-4 py-1.5 rounded-full text-xs font-bold transition-all ${appState.filters.chapter === ch ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white text-slate-600 border border-slate-200'}">
                        ${ch}
                    </button>
                `).join('')}
            </div>
        </div>
        <div class="space-y-5">
    `;

    const filteredRows = rows.filter(r => {
        const matchesChapter = appState.filters.chapter === 'All' || r[0].startsWith(appState.filters.chapter);
        const matchesSearch = !appState.filters.search || (r[0]+r[1]).toLowerCase().includes(appState.filters.search.toLowerCase());
        return matchesChapter && matchesSearch;
    });

    filteredRows.forEach((row, rowIndex) => {
        const id = row[0];
        const title = row[1];
        const prog = calculateRowProgress(row, checkboxCols);
        
        html += `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden card-anim">
            <div class="p-4 flex items-center justify-between border-b border-slate-100 bg-slate-50/50">
                <div class="flex items-center gap-3">
                    <span class="bg-indigo-100 text-indigo-700 text-[10px] font-black px-2 py-0.5 rounded uppercase">${id}</span>
                    <h3 class="font-bold text-sm text-slate-800 truncate max-w-[180px]">${title}</h3>
                </div>
                <div class="text-right">
                    <div class="text-[10px] font-bold text-slate-400 uppercase leading-none mb-1">Progress</div>
                    <div class="text-xs font-black text-indigo-600">${prog}%</div>
                </div>
            </div>
            
            <!-- The Deck System -->
            <div class="divide-y divide-slate-50">
                ${checkboxCols.map(col => {
                    const isChecked = (row[col.idx] || '').toString().toUpperCase() === 'TRUE';
                    return `
                    <div class="flex items-center justify-between p-3.5 hover:bg-slate-50 transition-colors">
                        <div class="flex items-center gap-3">
                            <div class="w-1.5 h-1.5 rounded-full ${isChecked ? 'bg-success' : 'bg-slate-200'}"></div>
                            <span class="text-sm font-semibold text-slate-700">${col.name}</span>
                        </div>
                        <label class="deck-toggle inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only" ${isChecked ? 'checked' : ''} onchange="updateCell('${sheetName}', ${rows.indexOf(row)}, ${col.idx}, this.checked)">
                            <div class="toggle-bg w-10 h-5 bg-slate-200 rounded-full p-0.5 transition-colors duration-200 ease-in-out">
                                <div class="toggle-dot w-4 h-4 bg-white rounded-full shadow-md transform transition-transform duration-200 ease-in-out"></div>
                            </div>
                        </label>
                    </div>`;
                }).join('')}
            </div>
        </div>`;
    });

    html += `</div>`;
    container.innerHTML = html;
}

function renderPlanner(container) {
    const sheetName = appState.names[1] || appState.names[0];
    const data = appState.sheets[sheetName];
    if (!data) return;

    const { headers, rows } = data;
    const checkboxCols = getCheckboxColumns(headers, rows);
    
    let html = `<div class="space-y-4">`;

    rows.forEach((row, rowIndex) => {
        const title = row[0] || 'Task';
        html += `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden card-anim">
            <div class="p-4 bg-slate-50/50 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-4 h-4 text-indigo-500"></i>
                    ${title}
                </h3>
            </div>
            <div class="divide-y divide-slate-50">
                ${checkboxCols.map(col => {
                    const isChecked = (row[col.idx] || '').toString().toUpperCase() === 'TRUE';
                    return `
                    <div class="flex items-center justify-between p-4">
                        <span class="text-sm font-semibold text-slate-600">${col.name}</span>
                        <label class="deck-toggle inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only" ${isChecked ? 'checked' : ''} onchange="updateCell('${sheetName}', ${rowIndex}, ${col.idx}, this.checked)">
                            <div class="toggle-bg w-10 h-5 bg-slate-200 rounded-full p-0.5 transition-colors">
                                <div class="toggle-dot w-4 h-4 bg-white rounded-full shadow transition-transform"></div>
                            </div>
                        </label>
                    </div>`;
                }).join('')}
            </div>
        </div>`;
    });

    html += `</div>`;
    container.innerHTML = html;
}

function renderSettings(container) {
    container.innerHTML = `
        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <h2 class="text-lg font-black mb-1">Configuration</h2>
            <p class="text-xs text-slate-500 mb-6 font-medium">Link your Google account for live sync.</p>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Google Sheets ID</label>
                    <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl text-xs font-mono text-slate-500 break-all">${SHEET_ID}</div>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Google API Key</label>
                    <input type="password" id="apiKeyIn" value="${API_KEY}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="AIza...">
                </div>
                <button onclick="saveApiKey()" class="w-full bg-primary text-white font-bold py-3 rounded-xl hover:bg-slate-800 transition-colors shadow-lg">Save & Connect</button>
            </div>
        </div>
    `;
}

// Helpers
function getCheckboxColumns(headers, rows) {
    const cols = [];
    headers.forEach((h, i) => {
        // A column is a checkbox only if at least some rows contain TRUE/FALSE
        let containsBool = false;
        rows.slice(0, 20).forEach(r => {
            const val = (r[i] || '').toString().toUpperCase();
            if (val === 'TRUE' || val === 'FALSE') containsBool = true;
        });
        if (containsBool) cols.push({ idx: i, name: h });
    });
    return cols;
}

function calculateRowProgress(row, cbCols) {
    if (!cbCols.length) return 0;
    const done = cbCols.filter(c => (row[c.idx] || '').toString().toUpperCase() === 'TRUE').length;
    return Math.round((done / cbCols.length) * 100);
}

function getChapters(rows) {
    const chs = new Set();
    rows.forEach(r => { 
        const match = (r[0] || '').split('.')[0];
        if (match) chs.add(match);
    });
    return ['All', ...Array.from(chs).sort()];
}

function updateCell(sheet, rowIdx, colIdx, val) {
    // Update local state for instant UI feel
    appState.sheets[sheet].rows[rowIdx][colIdx] = val ? 'TRUE' : 'FALSE';
    render();
    
    // Save to Google Sheets
    saveToSheet(sheet, rowIdx, colIdx, val);
}

async function saveToSheet(sheetName, rowIdx, colIdx, val) {
    showToast("Saving...", true);
    const colLetter = String.fromCharCode(65 + colIdx); // Simple A-Z
    const range = `${sheetName}!${colLetter}${rowIdx + 2}`;
    
    try {
        const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?valueInputOption=RAW&key=${API_KEY}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ values: [[val ? 'TRUE' : 'FALSE']] })
        });
        if (!res.ok) throw new Error();
        showToast("Progress Saved", false);
    } catch (e) {
        showToast("Save Failed", false, true);
    }
}

function switchTab(tab) {
    appState.activeTab = tab;
    document.querySelectorAll('nav button').forEach(b => {
        b.classList.remove('text-accent');
        b.classList.add('text-slate-400');
    });
    document.getElementById(`tab-${tab}`).classList.add('text-accent');
    document.getElementById(`tab-${tab}`).classList.remove('text-slate-400');
    render();
}

function saveApiKey() {
    const key = document.getElementById('apiKeyIn').value.trim();
    if (!key) return;
    API_KEY = key;
    try { localStorage.setItem('gapi_key', key); } catch(e){}
    loadData();
    switchTab('tracker');
}

function showToast(msg, isSaving, isError) {
    const toast = document.getElementById('toast');
    const msgEl = document.getElementById('toast-msg');
    const icon = document.getElementById('toast-icon');
    
    msgEl.textContent = msg;
    toast.classList.add('show');
    
    if (isSaving) {
        icon.className = "w-4 h-4 animate-spin text-indigo-400";
        icon.setAttribute('data-lucide', 'loader-2');
    } else if (isError) {
        icon.className = "w-4 h-4 text-red-400";
        icon.setAttribute('data-lucide', 'alert-circle');
        setTimeout(() => toast.classList.remove('show'), 2000);
    } else {
        icon.className = "w-4 h-4 text-green-400";
        icon.setAttribute('data-lucide', 'check');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
    lucide.createIcons();
}

function showError(msg) {
    const el = document.getElementById('errorDisplay');
    document.getElementById('errorMsg').textContent = msg;
    el.classList.remove('hidden');
}

function hideError() {
    document.getElementById('errorDisplay').classList.add('hidden');
}

function toggleSyncAnim(active) {
    const icon = document.getElementById('syncIcon');
    if (active) icon.classList.add('animate-spin');
    else icon.classList.remove('animate-spin');
}
</script>
</body>
</html>
