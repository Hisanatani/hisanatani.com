<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiSanatani Tracker v2</title>

<style>
:root{
  --bg:#f7f7f5;
  --card:#ffffff;
  --text:#1a1a1a;
  --muted:#777;
  --accent:#2d6a4f;
  --border:#e5e5e5;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:var(--bg);color:var(--text)}

.header{
  position:sticky;top:0;
  background:var(--card);
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}

button{cursor:pointer}

.container{padding:16px}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin:6px 0;
}

.label{color:var(--muted);font-size:12px}

input[type="text"]{
  width:100%;padding:6px;
  border:1px solid var(--border);
  border-radius:6px;
}

input[type="checkbox"]{
  transform:scale(1.2);
}

.stats{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.stat{background:var(--card);padding:10px;border-radius:8px;border:1px solid var(--border);font-size:12px}
.stat strong{display:block;font-size:16px}

@media(min-width:700px){
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
}
</style>
</head>

<body>

<div class="header">
  <div><strong>HiSanatani Tracker</strong></div>
  <button onclick="loadData()">Sync</button>
</div>

<div class="container">
  <div id="stats" class="stats"></div>
  <div id="app"></div>
</div>

<script>
const SHEET_ID = "13pUQeLmSwca3Jl4GCvOQ82Whiu79fgAfBAKi4PbhNKM";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCS07Se2VgpSoK0qeYj-zm4DQzJK7n_Gse0OMc0y-0LxkacVi96vAt0aWq4FX66kQ/exec";
const API_KEY = localStorage.getItem("gapi_key") || "";

let data = [];
let headers = [];

async function loadData(){
  if(!API_KEY){
    const key = prompt("Enter API Key");
    localStorage.setItem("gapi_key", key);
    location.reload();
  }

  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Content Creation Flow?key=${API_KEY}`);
  const json = await res.json();

  headers = json.values[0];
  data = json.values.slice(1);

  render();
}

function detectType(val){
  if(!val) return "text";
  val = val.toUpperCase();
  if(val === "TRUE" || val === "FALSE") return "checkbox";
  return "text";
}

function render(){
  const app = document.getElementById("app");
  const stats = document.getElementById("stats");

  let total = data.length;
  let done = 0;

  app.innerHTML = "";

  data.forEach((row, rIdx)=>{
    let completed = true;

    const card = document.createElement("div");
    card.className = "card";

    headers.forEach((h, cIdx)=>{
      const val = row[cIdx] || "";
      const type = detectType(val);

      const field = document.createElement("div");
      field.className = "row";

      if(type === "checkbox"){
        const checked = val === "TRUE";
        if(!checked) completed = false;

        field.innerHTML = `
          <span class="label">${h}</span>
          <input type="checkbox" ${checked?"checked":""}
            onchange="updateCell(${rIdx},${cIdx}, this.checked)">
        `;
      } else {
        field.innerHTML = `
          <span class="label">${h}</span>
          <input type="text" value="${val}"
            onchange="updateCell(${rIdx},${cIdx}, this.value)">
        `;
      }

      card.appendChild(field);
    });

    if(completed) done++;

    app.appendChild(card);
  });

  stats.innerHTML = `
    <div class="stat"><strong>${total}</strong>Total</div>
    <div class="stat"><strong>${done}</strong>Completed</div>
  `;
}

async function updateCell(row, col, value){
  data[row][col] = value;

  await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      row: row + 2,
      col: col + 1,
      value: value === true ? "TRUE" : value === false ? "FALSE" : value
    })
  });
}

loadData();
</script>

</body>
</html>
